<svg viewBox="0 0 1004 572" width="1004" height="572" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Campin – prévia em breve">
  <defs>
    <linearGradient id="campin-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00A3FF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- janela do app -->
  <rect x="60" y="60" width="884" height="452" rx="18" fill="url(#campin-glow)" stroke="#00A3FF" stroke-width="2"/>

  <!-- barra superior -->
  <line x1="60" y1="128" x2="944" y2="128" stroke="#00A3FF" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="98" cy="94" r="7" fill="#00A3FF" fill-opacity="0.5"/>
  <circle cx="124" cy="94" r="7" fill="#00A3FF" fill-opacity="0.3"/>
  <circle cx="150" cy="94" r="7" fill="#00A3FF" fill-opacity="0.3"/>
  <text x="502" y="99" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#00A3FF" fill-opacity="0.55" letter-spacing="1">appcampin.com.br</text>

  <!-- pin de geolocalizacao -->
  <g transform="translate(502, 220)">
    <path d="M0 -46 C25 -46 45 -27 45 -3 C45 26 0 60 0 60 C0 60 -45 26 -45 -3 C-45 -27 -25 -46 0 -46 Z" fill="none" stroke="#00A3FF" stroke-width="3"/>
    <circle cx="0" cy="-3" r="14" fill="#00A3FF" fill-opacity="0.25" stroke="#00A3FF" stroke-width="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="502" y="360" text-anchor="middle" font-family="'Courier New', monospace" font-size="52" font-weight="bold" fill="#FFFFFF" letter-spacing="1">Campin<tspan fill="#00A3FF">.</tspan></text>
  <text x="502" y="396" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" fill="#FFFFFF" fill-opacity="0.55" letter-spacing="0.5">Gestão de Distribuição de Panfletos · SaaS B2B</text>

  <!-- aviso -->
  <text x="502" y="470" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#00A3FF" fill-opacity="0.7" letter-spacing="0.5">Screenshots em breve</text>
