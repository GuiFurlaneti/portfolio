<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="balta - Logotipo">
  <defs>
    <linearGradient id="balta-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1FD6"/>
      <stop offset="100%" stop-color="#4C0E9E"/>
    </linearGradient>
  </defs>

  <rect width="280" height="280" fill="url(#balta-bg)"/>

  <!-- pequeno quadrado branco no canto superior esquerdo -->
  <rect x="62" y="62" width="36" height="36" fill="#FFFFFF"/>

  <!-- pequeno triangulo roxo no canto inferior direito -->
  <path d="M182 254 L218 254 L218 218 Z" fill="url(#balta-bg)"/>

  <!-- hexagono/cubo isometrico branco com furo hexagonal no centro -->
  <path d="M140 58
           L216 100 L216 184 L140 226
           L64 184 L64 100 Z
           M140 96
           L182 120 L182 164 L140 188
           L98 164 L98 120 Z"
        fill="#FFFFFF" fill-rule="evenodd"/>

  <!-- linhas internas sugerindo as faces do cubo -->
  <path d="M140 96 V188 M98 120 L182 164 M182 120 L98 164"
        stroke="url(#balta-bg)" stroke-width="6" stroke-linecap="round"/>
</svg>
